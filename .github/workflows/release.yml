# Gera o EcoPDF.zip a partir da pasta EcoPDF/ e cria um RASCUNHO de release com ele
# anexado, com o numero de EcoPDF/VERSAO.txt. Dispara pelo botao "Run workflow"
# (aba Actions) ou ao enviar uma tag com o numero da versao.
# O rascunho nao e visto pelas salas: falta o EcoPDF.zip.sig, que o Helder
# gera offline com o assinador e anexa antes de publicar.
name: Rascunho de release

on:
  workflow_dispatch:
  push:
    tags: ["20[0-9][0-9].[0-9][0-9].[0-9][0-9]*"]

permissions:
  contents: write

jobs:
  rascunho:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Numero da versao
        run: |
          V=$(python -c "print(open('EcoPDF/VERSAO.txt', encoding='utf-8-sig').read().strip())")
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "$V" ]; then
            echo "Tag ${{ github.ref_name }} diferente de VERSAO.txt ($V)"; exit 1
          fi
          if gh release view "$V" >/dev/null 2>&1; then
            echo "Ja existe release $V. Aumente o numero em EcoPDF/VERSAO.txt."; exit 1
          fi
          echo "TAG=$V" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Gerar EcoPDF.zip
        run: python ferramentas/empacotar.py EcoPDF.zip
      - name: Notas da versao (trecho do NOVIDADES.txt)
        run: |
          python - <<'PY'
          import os, re
          tag = os.environ["TAG"]
          linhas = open("EcoPDF/NOVIDADES.txt", encoding="utf-8-sig").read().splitlines()
          notas, dentro = [], False
          for l in linhas:
              if re.match(r"^\d{4}\.\d{2}\.\d{2}(\.\d+)?\s*$", l.strip()):
                  dentro = l.strip() == tag
                  continue
              if dentro:
                  notas.append(l)
          texto = "\n".join(notas).strip() or "(sem notas no NOVIDADES.txt)"
          texto += "\n\n---\nRascunho: falta anexar EcoPDF.zip.sig (assinar.bat no pendrive) antes de publicar."
          open("notas.md", "w", encoding="utf-8").write(texto)
          PY
      - name: Criar rascunho
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" EcoPDF.zip --draft --target "${{ github.sha }}" --title "$TAG" --notes-file notas.md
