[ecopdf]
; ---- Recepcao DICOM (estes 2 valores vao no Vivid) ----
AE_TITLE = ECOPDF
PORTA = 11112

; ---- Pastas ----
; No Explorer: Shift + botao direito na pasta > "Copiar como caminho" (sem aspas aqui)
; Onde o renomear_laudos.py coloca os laudos ja renomeados (antiga pasta prontos)
; %DESKTOP% = Area de Trabalho do usuario logado: o mesmo arquivo serve em todos os PCs.
PASTA_AGUARDANDO_IMAGENS = %DESKTOP%\Laudos - Não Apagar\1 - Laudos aguardando imagens
; Onde o EcoPDF coloca os PDFs de imagens (e o PENDENTES.txt)
PASTA_AGUARDANDO_FOTOS = %DESKTOP%\Laudos - Não Apagar\2 - Imagens aguardando laudo
; Laudo + imagens, com o mesmo nome do laudo, pronto para o prontuario
PASTA_FINALIZADOS = %DESKTOP%\Laudos - Não Apagar\3 - Finalizados (subir no prontuário)
; Uso interno (relativas = dentro de C:\EcoPDF)
PASTA_PROCESSADOS = processados
PASTA_DICOM = dicom
PASTA_LOG = log

; Renomeador de laudos embutido (0 - Entrada PDF24 -> pasta 1). sim | nao
RENOMEADOR = sim

; ---- Quando o exame esta completo ----
; Segundos sem chegar imagem nova para fechar o PDF do exame
ESPERA_SEGUNDOS = 150

; ---- Layout do PDF de imagens (A4 retrato) ----
COLUNAS = 2
LINHAS = 4
; Loops (video): ignorar = o PC aceita o loop mas nao guarda nem poe no PDF (so imagem parada vai).
; Assim o aparelho pode mandar tudo (ex.: Philips com o botao Acquire) sem encher o disco.
; Outras opcoes: meio | primeiro | ultimo = usa esse quadro do loop no PDF e guarda o loop.
QUADRO_LOOP = ignorar
; Simbolo (coracao) ao lado de "Clinica Ecocardio", PNG dentro de C:\EcoPDF
SIMBOLO = simbolo.png
; Rodape igual ao do laudo; "|" separa as linhas
RODAPE = Tambauzinho: Maria Caetano, 131 · Bessa: Fernando Luiz, 1403 · Bancários: Guilherme Serrano, 33 | João Pessoa/PB · (83) 3021-3030 · (83) 98130-3030

; ---- Juncao com o laudo ----
; 0 a 1. Tolera erro de digitacao (Lustos x Lustosa = 0,92)
SEMELHANCA_NOME = 0.85
; Minutos parado sem par ate aparecer em PENDENTES.txt
PENDENTES_MINUTOS = 30
; Final refeito (laudo corrigido, imagens adicionadas/tiradas) ganha este fim de nome
SUFIXO_REFEITO = _retificado

; ---- Manutencao ----
; Dias que o DICOM original fica guardado (0 = para sempre). Enquanto estiver guardado da para
; tirar, voltar e acrescentar imagens. Reduzir apaga os mais antigos na proxima limpeza.
MANTER_DICOM_DIAS = 180

[tipos]
; nome do tipo = exatamente como aparece no FIM do nome do laudo
; valor = expressao procurada nos campos DICOM da imagem (sonda, descricao)
; AJUSTAR depois do 1o exame real: o log mostra os campos que o Vivid manda.
; Fetal primeiro: a sonda convexa decide antes das regras do eco adulto
Ecocardiograma_Fetal = 4C|C1-5|C2-9|C1-6|C5-1|Fetal
Ecocardiograma = M5S|M4S|3S|6S|S4-2|S5-1|X5-1|Cardiac|Adult|Echo
Duplex_Scan_Vascular_Carotidas = 9L|11L|12L|ML6|L8|L12|L9-3|L15|Carot|Vasc
