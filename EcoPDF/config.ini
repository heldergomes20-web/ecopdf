[ecopdf]
; ---- Recepcao DICOM (estes 2 valores vao no Vivid) ----
AE_TITLE = ECOPDF
PORTA = 11112

; ---- Pastas ----
; No Explorer: Shift + botao direito na pasta > "Copiar como caminho" (sem aspas aqui)
; Onde o renomear_laudos.py coloca os laudos ja renomeados (antiga pasta prontos)
; %DESKTOP% = Area de Trabalho do usuario logado: o mesmo arquivo serve em todos os PCs.
PASTA_AGUARDANDO_IMAGENS = %DESKTOP%\Laudos - Não Apagar\1 - Laudos aguardando imagens
; Onde o EcoPDF coloca os PDFs de imagens (e o PENDENTES.txt)
PASTA_AGUARDANDO_FOTOS = %DESKTOP%\Laudos - Não Apagar\2 - Imagens aguardando laudo
; Laudo + imagens, com o mesmo nome do laudo, pronto para o prontuario
PASTA_FINALIZADOS = %DESKTOP%\Laudos - Não Apagar\3 - Finalizados (subir no prontuário)
; Uso interno (relativas = dentro de C:\EcoPDF)
PASTA_PROCESSADOS = processados
PASTA_DICOM = dicom
PASTA_LOG = log

; Renomeador de laudos embutido (0 - Entrada PDF24 -> pasta 1). sim | nao
RENOMEADOR = sim

; ---- Quando o exame esta completo ----
; Segundos sem chegar imagem nova para fechar o PDF do exame
ESPERA_SEGUNDOS = 150

; ---- Layout do PDF de imagens (A4 retrato) ----
COLUNAS = 2
LINHAS = 4
; Loops (video): ignorar = o PC aceita o loop mas nao guarda nem poe no PDF (so imagem parada vai).
; Assim o aparelho pode mandar tudo (ex.: Philips com o botao Acquire) sem encher o disco.
; Outras opcoes: meio | primeiro | ultimo = usa esse quadro do loop no PDF e guarda o loop.
QUADRO_LOOP = ignorar
; Tipo pela frequencia da sonda: quando o aparelho nao manda o nome da sonda (Vivid S6 nao manda),
; a frequencia separa os exames: a partir de FREQ_CORTE_MHZ = TIPO_FREQ_ALTA (linear das carotidas,
; ~8,9 MHz); abaixo = TIPO_FREQ_BAIXA (eco, ~1,7 MHz), ou o tipo que a descricao do exame disser
; (ex.: fetal, vindo da lista de pacientes). Vale para exames iniciados depois da instalacao.
TIPO_POR_FREQUENCIA = sim
FREQ_CORTE_MHZ = 6
TIPO_FREQ_ALTA = Duplex_Scan_Vascular_Carotidas
TIPO_FREQ_BAIXA = Ecocardiograma
; Tamanho do PDF (so administracao): qualidade JPEG das fotos (50-95) e largura maxima em pixels
; (0 = original). 80 + 1000 px: ~35% menor que 92/original, sem diferenca na impressao nem no PC.
QUALIDADE_JPEG = 80
LARGURA_MAX_IMAGEM = 1000
; Simbolo (coracao) ao lado de "Clinica Ecocardio", PNG dentro de C:\EcoPDF
SIMBOLO = simbolo.png
; Rodape igual ao do laudo; "|" separa as linhas
RODAPE = Tambauzinho: Maria Caetano, 131 · Bessa: Fernando Luiz, 1403 · Bancários: Guilherme Serrano, 33 | João Pessoa/PB · (83) 3021-3030 · (83) 98130-3030

; ---- Juncao com o laudo ----
; 0 a 1. Tolera erro de digitacao (Lustos x Lustosa = 0,92)
SEMELHANCA_NOME = 0.85
; Minutos parado sem par ate aparecer em PENDENTES.txt
PENDENTES_MINUTOS = 30
; Final refeito (laudo corrigido, imagens adicionadas/tiradas) ganha este fim de nome
SUFIXO_REFEITO = _retificado

; ---- Tela "EcoPDF - Exames" (navegador, so neste PC) ----
; Endereco: http://127.0.0.1:TELA_PORTA  (0 = desliga a tela)
TELA_PORTA = 8765
; Abrir a tela sozinha: ao_receber (quando chega imagem ou laudo e ela nao esta aberta)
;   | sim (ao entrar no Windows) | nao (so pelo atalho)
TELA_ABRIR = ao_receber
; Pasta "Laudos - Nao Apagar" oculta na Area de Trabalho (sim/nao). O caminho nao muda;
; a pasta 3 abre pelo botao "Pasta de prontos" da tela.
OCULTAR_PASTAS = sim
; Botao Imprimir da tela: sim = manda direto para a impressora padrao, em dois envios
;   (folhas de fotos com papel fotografico e qualidade alta do driver; depois o laudo em
;   papel comum, so quando as fotos terminarem). Impressora sem modo foto: um envio so.
;   Se existir a impressora "EcoPDF Foto" (criar_fila_foto.bat), as fotos vao para ela
;   com a configuracao salva no driver e o laudo para a padrao.
;   nao = abre a janela de impressao do navegador (jeito antigo).
IMPRESSAO_DIRETA = sim

; ---- Lista de pacientes (worklist) ----
; sim = o aparelho puxa os pacientes do dia do Medware (Query na tela de paciente), na mesma
;   porta e AE das imagens. So LE o banco do Medware; nunca grava. nao = desliga.
WORKLIST = sim
; Onde esta o banco do Medware: o EcoPDF le sozinho o C:\Medware LaudosFlex\Bd.xml deste PC
; (servidor, caminho e porta que o proprio Medware usa) e tenta esse primeiro; depois a lista
; abaixo (127.0.0.1 = este PC). O primeiro que responder e usado. So para forcar outro endereco:
; MEDWARE_SERVIDORES = nome-ou-IP, ... no painel.ini (vale no lugar do Bd.xml e desta linha).
; Senha do banco, se nao for a padrao: MEDWARE_SENHA no painel.ini (nunca aqui).
MEDWARE_SERVIDORES = 127.0.0.1
MEDWARE_BANCO = C:\Medware LaudosFlex\BD\Clinicas.fdb

; ---- Manutencao ----
; Dias que o DICOM original fica guardado (0 = para sempre). Enquanto estiver guardado da para
; tirar, voltar, reordenar (pela tela) e acrescentar imagens. Reduzir apaga os mais antigos na proxima limpeza.
; O mesmo prazo vale para os PDFs da pasta 3 (ninguem precisa apagar a mao); laudo e folha
; guardados em processados continuam, e reimprimir o laudo refaz o final a qualquer tempo.
MANTER_DICOM_DIAS = 180

; ---- Painel das salas (planilha da administracao) ----
; Endereco e chave da planilha NAO ficam aqui (o zip e publico): ficam no arquivo painel.ini,
; copiado do pendrive para C:\EcoPDF na instalacao de cada PC. Sem ele, nada sai do PC.
; Vai so numero, horario, versao e nome do computador; nunca nome de paciente.
PAINEL_URL =
PAINEL_CHAVE =
; Envio a cada N minutos enquanto o PC esta ligado (Helder 03/11: 15). A planilha marca
; SEM SINAL se faltar o envio das 9h ou das 15h (meia hora de tolerancia).
PAINEL_INTERVALO_MIN = 15
; So com PAINEL_INTERVALO_MIN = 0: envio nestes horarios (PC desligado: envia ao ligar).
PAINEL_HORARIOS = 09:00, 15:00

[tipos]
; nome do tipo = exatamente como aparece no FIM do nome do laudo
; valor = expressao procurada nos campos DICOM da imagem (sonda, descricao)
; AJUSTAR depois do 1o exame real: o log mostra os campos que o Vivid manda.
; Fetal primeiro: a sonda convexa decide antes das regras do eco adulto
Ecocardiograma_Fetal = 4C|C1-5|C2-9|C1-6|C5-1|Fetal
Ecocardiograma = M5S|M4S|3S|6S|S4-2|S5-1|X5-1|Cardiac|Adult|Echo
Duplex_Scan_Vascular_Carotidas = 9L|11L|12L|ML6|L8|L12|L9-3|L15|Carot|Vasc
